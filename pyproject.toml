[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sgrna-array"
version = "0.1.0"
description = "Design ribozyme-flanked sgRNA DNA fragments for PaqCI Golden Gate assembly into multi-sgRNA arrays expressed from a Pol II intron."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Joshua Currie", email = "curriej@wfu.edu" },
]
keywords = ["CRISPR", "sgRNA", "Golden Gate", "PaqCI", "ribozyme", "Cas9", "multiplex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "biopython>=1.83",
]

[project.optional-dependencies]
web = [
    "flask>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.scripts]
sgrna-array = "sgrna_array.cli:main"

[project.urls]
Repository = "https://github.com/curriej/sgrna-array-webtool"

[tool.setuptools.packages.find]
include = ["sgrna_array*", "webapp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]
